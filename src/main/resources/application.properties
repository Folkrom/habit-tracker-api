# OpenAPI config
quarkus.smallrye-openapi.info-title=habit-tracker-api
quarkus.smallrye-openapi.info-version=0.0.1
quarkus.smallrye-openapi.info-description=A simple API to manage habits and routines.
quarkus.swagger-ui.display-operation-id=true
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.always-include=true

# Database configuration (PostgreSQL)
quarkus.datasource.db-kind  = postgresql
quarkus.datasource.username = ${DB_USER}
quarkus.datasource.password = ${DB_PASS}
quarkus.datasource.jdbc.url = jdbc:postgresql://${DB_HOST:${QUARKUS_DB_HOST:localhost}}:${DB_PORT:${QUARKUS_DB_PORT:5432}}/${DB_NAME}
